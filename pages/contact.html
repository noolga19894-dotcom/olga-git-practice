<!DOCTYPE html>
<html>
    <head>
        <title>Busya's contact</title>
        <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
    </head>
    <body>
        <h1 style="color: purple; text-align: center; font-size: 40px; margin-bottom: 25px;">Contact Busya's manager🐈</h1>
        <button class="w3-button w3-purple w3-round-large w3-hover-orange" onclick="window.location.href='../index.html'">👈Back to home</button>
        <p style="color: red; padding: 10px; margin: 20px; font-style: italic; font-size: 20px;">For questions about Busya, please contact her manager, Olha</p>
        <p>Email: <a href="mailto:noolga19894@gmail.com">Contact Olha</a> - noolga19894@gmail.com</p>
        <p style="margin: 20px 0; padding: 15px; border: 2px dashed purple; border-radius: 15px; text-align: center;">Instagram: <a href="https://www.instagram.com/nosovskaya_olga/">@nosovskaya_olga</a> 📸</p>
        <h2>Contact me</h2>
        <form>
          <label for="name">Name:</label>
    <input type="text" id="name" name="name" style="padding: 10px; margin: 8px 8px; border: 2px solid purple; border-radius: 8px; width: 250px;">
    
    <br><br>
    
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" style="padding: 10px; margin: 8px 8px; border: 2px solid rgb(162, 13, 28); border-radius: 8px; width: 250px;">
    
    <br><br>
    
    <label for="phone">Phone:</label>
    <input type="tel" id="phone" name="phone" style="padding: 10px; margin: 8px 8px; border: 2px solid rgb(18, 143, 37); border-radius: 8px; width: 250px;">
    
    <br><br>
    
    <input type="checkbox" id="agree" name="agree">
    <label for="agree">I agree to be contacted</label>
    
    <br><br>
    
    <button type="submit" style="background-color: purple; color: white; padding: 12px 30px; margin-top: 20px; border: 3px solid orange; border-radius: 20px; font-size: 16px; font-weight: bold; cursor: pointer;">Send Message 🐾</button>   
        </form>
    </body>
</html>
